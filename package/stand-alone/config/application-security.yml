spring:
  security:
    antpatterns: "/web/dist/**,/web/websocket.html"
    csrf-enable: false
    source-ip-enable: false
    # 白名单认证开关，默认关闭（已废弃，请使用 ip-whitelist-enable 和 mac-whitelist-enable）
    whitelist-enable: false
    # IP 白名单认证开关，默认关闭
    ip-whitelist-enable: false
    # MAC 白名单认证开关，默认关闭
    mac-whitelist-enable: false